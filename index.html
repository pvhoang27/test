<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng dụng Đo Bước Chân</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚶‍♂️ Đo Bước Chân</h1>
            <p class="subtitle">Pedometer App</p>
        </header>

        <main>
            <div class="step-display">
                <div class="step-count" id="stepCount">0</div>
                <p class="step-label">Bước</p>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <span class="stat-value" id="distance">0.00</span>
                    <span class="stat-label">km</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="calories">0</span>
                    <span class="stat-label">calories</span>
                </div>
            </div>

            <div class="controls">
                <button id="startBtn" class="btn btn-primary">Bắt đầu</button>
                <button id="pauseBtn" class="btn btn-secondary" disabled>Tạm dừng</button>
                <button id="resetBtn" class="btn btn-danger">Đặt lại</button>
            </div>

            <div class="info-box">
                <p id="statusText">Nhấn "Bắt đầu" để bắt đầu đếm bước</p>
                <p class="sensor-info" id="sensorInfo">Đang kiểm tra cảm biến...</p>
            </div>

            <div class="history">
                <h3>Lịch sử hôm nay</h3>
                <div id="todayHistory">
                    <p class="no-data">Chưa có dữ liệu</p>
                </div>
            </div>
        </main>

        <footer>
            <p>Tip: Mang điện thoại theo người và di chuyển để ứng dụng có thể đếm bước chân của bạn</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
